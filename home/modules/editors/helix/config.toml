theme = "gruvbox-material"

[editor]
line-number = "relative"
mouse = true
scrolloff = 10
color-modes = true

[editor.cursor-shape]
normal = "block"
insert = "bar"

[editor.lsp]
enable = true
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "warning"

[keys.normal]
"X" = ["extend_line_up", "extend_to_line_bounds"]
